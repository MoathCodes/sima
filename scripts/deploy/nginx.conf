# Sample nginx server block in front of the live service on 127.0.0.1:8765.
# Add your TLS lines (for example from certbot). frames.bin.gz is already gzip, so gzip stays off.
server {
    listen 443 ssl;
    server_name live.your-domain.example;

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        gzip off;
    }
}
